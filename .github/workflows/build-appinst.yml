name: Build appinst 2.1.1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout AppSync
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            fakeroot \
            rsync \
            curl \
            perl \
            zip \
            git \
            libxml2 \
            xz-utils \
            unzip \
            bzip2 \
            libio-compress-lzma-perl

      # ------------------------------------------------------------
      # Install Theos
      # ------------------------------------------------------------
      - name: Install Theos
        run: |
          git clone --recursive --depth 1 \
            https://github.com/theos/theos.git \
            "$RUNNER_TEMP/theos"

          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # Install Linux iOS toolchain
      #
      # Theos on Linux requires the separate iOS clang/llvm/ld64
      # toolchain. The official Theos documentation describes this
      # as a required step for Linux builds.
      # ------------------------------------------------------------
      - name: Install Linux iOS toolchain
        run: |
          TOOLCHAIN_URL="https://github.com/theos/ios-toolchain/releases/latest/download/ios-toolchain_clang%2Bllvm%2Bld64_latest_linux_x86_64.zip"

          mkdir -p "$THEOS/toolchain"

          curl -fL \
            "$TOOLCHAIN_URL" \
            -o "$RUNNER_TEMP/ios-toolchain.zip"

          unzip -q \
            "$RUNNER_TEMP/ios-toolchain.zip" \
            -d "$THEOS/toolchain"

          echo "=== Installed toolchain ==="
          find "$THEOS/toolchain" -maxdepth 4 -type f \
            \( -name clang -o -name ldid \) \
            -print

      # ------------------------------------------------------------
      # Install official iPhoneOS 12.4 SDK
      # ------------------------------------------------------------
      - name: Install official iPhoneOS 12.4 SDK
        run: |
          git clone \
            --depth 1 \
            --filter=blob:none \
            --sparse \
            https://github.com/theos/sdks.git \
            "$RUNNER_TEMP/theos-sdks"

          cd "$RUNNER_TEMP/theos-sdks"

          git sparse-checkout set iPhoneOS12.4.sdk

          mkdir -p "$THEOS/sdks"

          cp -a \
            iPhoneOS12.4.sdk \
            "$THEOS/sdks/"

      # ------------------------------------------------------------
      # Verify environment
      # ------------------------------------------------------------
      - name: Verify Theos environment
        run: |
          echo "=== THEOS ==="
          echo "$THEOS"

          echo
          echo "=== SDKs ==="
          find "$THEOS/sdks" -maxdepth 1 -mindepth 1 -type d -print

          test -d "$THEOS/sdks/iPhoneOS12.4.sdk"

          echo
          echo "=== Toolchain ==="
          find "$THEOS/toolchain" \
            -maxdepth 5 \
            -type f \
            -name clang \
            -print

          CLANG="$(find "$THEOS/toolchain" \
            -maxdepth 5 \
            -type f \
            -name clang \
            | head -n 1)"

          test -n "$CLANG"
          test -x "$CLANG"

          echo
          echo "Using clang:"
          "$CLANG" --version

          echo
          echo "=== ldid ==="
          LDID="$(find "$THEOS/toolchain" \
            -maxdepth 5 \
            -type f \
            -name ldid \
            | head -n 1)"

          if [ -n "$LDID" ]; then
            "$LDID" -h || true
          fi

      # ------------------------------------------------------------
      # Build ONLY appinst
      # ------------------------------------------------------------
      - name: Build appinst
        working-directory: appinst
        run: |
          make clean || true
          make package

      # ------------------------------------------------------------
      # Inspect generated packages
      # ------------------------------------------------------------
      - name: Inspect generated DEBs
        run: |
          echo "=== Generated DEBs ==="

          find appinst \
            -type f \
            -name '*.deb' \
            -print

          echo
          echo "=== Package metadata ==="

          find appinst \
            -type f \
            -name '*.deb' \
            -print0 |
          while IFS= read -r -d '' deb; do
            echo
            echo "----------------------------------------"
            echo "$deb"
            echo "----------------------------------------"
            dpkg-deb -I "$deb"
          done

      # ------------------------------------------------------------
      # Upload appinst
      # ------------------------------------------------------------
      - name: Upload appinst DEB
        uses: actions/upload-artifact@v4
        with:
          name: appinst-2.1.1-iphoneos-arm
          path: |
            appinst/debs/ai.akemi.appinst_*.deb
          if-no-files-found: error
