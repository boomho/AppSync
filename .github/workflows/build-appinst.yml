name: Build appinst 2.1.1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout AppSync
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            fakeroot \
            rsync \
            curl \
            perl \
            zip \
            git \
            libxml2 \
            xz-utils \
            unzip \
            bzip2 \
            libio-compress-lzma-perl

      # ------------------------------------------------------------
      # Install Theos
      # ------------------------------------------------------------
      - name: Install Theos
        run: |
          git clone --recursive --depth 1 \
            https://github.com/theos/theos.git \
            "$RUNNER_TEMP/theos"

          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # Install Linux iOS toolchain
      #
      # Theos on Linux requires the separate iOS clang/llvm/ld64
      # toolchain. The official Theos documentation describes this
      # as a required step for Linux builds.
      # ------------------------------------------------------------
      - name: Install Linux iOS toolchain
        run: |
          sudo apt-get install -y libtinfo6

          mkdir -p "$THEOS/toolchain"

          curl -sL \
            "https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz" \
            | tar -xJvf - \
              -C "$THEOS/toolchain/"

          echo
          echo "=== Toolchain tree ==="
          find "$THEOS/toolchain" -maxdepth 5 -type f | sort | head -200

          echo
          echo "=== clang ==="
          test -x "$THEOS/toolchain/linux/iphone/bin/clang"

          "$THEOS/toolchain/linux/iphone/bin/clang" --version
      # ------------------------------------------------------------
      # Install official iPhoneOS 12.4 SDK
      # ------------------------------------------------------------
      - name: Install official iPhoneOS 12.4 SDK
        run: |
          git clone \
            --depth 1 \
            --filter=blob:none \
            --sparse \
            https://github.com/theos/sdks.git \
            "$RUNNER_TEMP/theos-sdks"

          cd "$RUNNER_TEMP/theos-sdks"

          git sparse-checkout set iPhoneOS12.4.sdk

          mkdir -p "$THEOS/sdks"

          cp -a \
            iPhoneOS12.4.sdk \
            "$THEOS/sdks/"

      # ------------------------------------------------------------
      # Verify environment
      # ------------------------------------------------------------
      - name: Verify Theos environment
        run: |
          echo "=== THEOS ==="
          echo "$THEOS"

          echo
          echo "=== SDK ==="
          test -d "$THEOS/sdks/iPhoneOS12.4.sdk"
          echo "iPhoneOS12.4.sdk: OK"

          echo
          echo "=== clang ==="
          test -x "$THEOS/toolchain/linux/iphone/bin/clang"
          "$THEOS/toolchain/linux/iphone/bin/clang" --version

          echo
          echo "=== ldid ==="
          test -x "$THEOS/toolchain/linux/iphone/bin/ldid"
          "$THEOS/toolchain/linux/iphone/bin/ldid" -h || true

          echo
          echo "=== Theos environment: OK ==="

      - name: Install appinst libzip dependency
        run: |
          mkdir -p "$THEOS/lib"
          mkdir -p "$THEOS/include"

          cp appinst/libzip.a "$THEOS/lib/libzip.a"
          cp appinst/zip.h "$THEOS/include/zip.h"

          echo "=== libzip ==="
          ls -lh "$THEOS/lib/libzip.a"

          echo "=== zip.h ==="
          ls -lh "$THEOS/include/zip.h"


      # ------------------------------------------------------------
      # Build ONLY appinst
      # ------------------------------------------------------------
      - name: Build appinst
        working-directory: appinst
        run: |
          make clean || true
          make package
          
      # ------------------------------------------------------------
      # Inspect generated packages
      # ------------------------------------------------------------
      - name: Inspect generated DEBs
        run: |
          echo "=== Generated DEBs ==="

          find appinst \
            -type f \
            -name '*.deb' \
            -print

          echo
          echo "=== Package metadata ==="

          find appinst \
            -type f \
            -name '*.deb' \
            -print0 |
          while IFS= read -r -d '' deb; do
            echo
            echo "----------------------------------------"
            echo "$deb"
            echo "----------------------------------------"
            dpkg-deb -I "$deb"
          done

      # ------------------------------------------------------------
      # Upload appinst
      # ------------------------------------------------------------
      - name: Upload appinst DEB
        uses: actions/upload-artifact@v4
        with:
          name: appinst-2.1.1-iphoneos-arm
          path: |
            appinst/debs/ai.akemi.appinst_*.deb
          if-no-files-found: error
