name: Build appinst

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      # ------------------------------------------------------------
      # 1. Checkout official AppSync
      # ------------------------------------------------------------
      - name: Checkout AppSync
        uses: actions/checkout@v5

      # ------------------------------------------------------------
      # 2. Build dependencies
      # ------------------------------------------------------------
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            fakeroot \
            rsync \
            curl \
            perl \
            git \
            libxml2 \
            libtinfo6 \
            autoconf \
            automake \
            libtool \
            pkg-config \
            xz-utils \
            file

      # ------------------------------------------------------------
      # 3. Theos
      # ------------------------------------------------------------
      - name: Install Theos
        run: |
          git clone --recursive \
            https://github.com/theos/theos.git \
            "$RUNNER_TEMP/theos"

          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # 4. Official iPhoneOS 12.4 SDK
      # ------------------------------------------------------------
      - name: Install iPhoneOS 12.4 SDK
        run: |
          mkdir -p "$THEOS/sdks"

          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/theos/sdks.git \
            "$RUNNER_TEMP/sdks"

          cd "$RUNNER_TEMP/sdks"
          git sparse-checkout set iPhoneOS12.4.sdk

          cp -R \
            iPhoneOS12.4.sdk \
            "$THEOS/sdks/"

          test -d "$THEOS/sdks/iPhoneOS12.4.sdk"

      # ------------------------------------------------------------
      # 5. Current Theos Linux iOS toolchain
      # ------------------------------------------------------------
      - name: Install iOS toolchain
        run: |
          mkdir -p "$THEOS/toolchain"

          curl -fL \
            "https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz" \
            | tar -xJvf - -C "$THEOS/toolchain/"

          test -x "$THEOS/toolchain/linux/iphone/bin/clang"

      # ------------------------------------------------------------
      # 6. Verify environment
      # ------------------------------------------------------------
      - name: Verify Theos
        run: |
          echo "=== THEOS ==="
          echo "$THEOS"

          echo "=== SDK ==="
          ls -ld "$THEOS/sdks/iPhoneOS12.4.sdk"

          echo "=== clang ==="
          "$THEOS/toolchain/linux/iphone/bin/clang" --version

      # ------------------------------------------------------------
      # 7. Download official libzip 0.11.2 source
      # ------------------------------------------------------------
      - name: Download libzip 0.11.2
        run: |
          mkdir -p "$RUNNER_TEMP/libzip"

          curl -fL \
            "https://libzip.org/download/libzip-0.11.2.tar.xz" \
            -o "$RUNNER_TEMP/libzip-0.11.2.tar.xz"

          file "$RUNNER_TEMP/libzip-0.11.2.tar.xz"

          tar -xJf \
            "$RUNNER_TEMP/libzip-0.11.2.tar.xz" \
            -C "$RUNNER_TEMP/libzip"

          test -d "$RUNNER_TEMP/libzip/libzip-0.11.2"

      # ------------------------------------------------------------
      # 8. Build ONLY libzip.a for arm64
      #
      # Do NOT run the normal "make".
      # That would also build zipcmp/zipmerge/ziptorrent,
      # which we do not need.
      # ------------------------------------------------------------
      - name: Build libzip arm64
        run: |
          set -e

          SRC="$RUNNER_TEMP/libzip/libzip-0.11.2"
          BUILD="$RUNNER_TEMP/libzip-build-arm64"
          SDK="$THEOS/sdks/iPhoneOS12.4.sdk"
          CLANG="$THEOS/toolchain/linux/iphone/bin/clang"

          rm -rf "$BUILD"
          mkdir -p "$BUILD"

          cd "$SRC"

          make distclean >/dev/null 2>&1 || true

          ./configure \
            --host=aarch64-apple-darwin \
            --enable-static \
            --disable-shared \
            --disable-fs \
            --disable-crypto \
            --disable-gnupg \
            --disable-bzip2 \
            --disable-lzma \
            --disable-zstd \
            --prefix="$BUILD/install" \
            CC="$CLANG" \
            CFLAGS="-target arm64-apple-ios7.0 -isysroot $SDK -miphoneos-version-min=7.0" \
            LDFLAGS="-target arm64-apple-ios7.0 -isysroot $SDK -miphoneos-version-min=7.0"

          # Build only the library.
          make -C lib -j"$(nproc)"

          test -f "$SRC/lib/.libs/libzip.a"

          mkdir -p "$BUILD/install/lib"

          cp \
            "$SRC/lib/.libs/libzip.a" \
            "$BUILD/install/lib/libzip.a"

          echo "=== libzip.a ==="
          ls -lh "$BUILD/install/lib/libzip.a"
          file "$BUILD/install/lib/libzip.a"

      # ------------------------------------------------------------
      # 9. Install libzip into Theos
      # ------------------------------------------------------------
      - name: Install libzip into Theos
        run: |
          set -e

          mkdir -p "$THEOS/lib"

          cp \
            "$RUNNER_TEMP/libzip-build-arm64/install/lib/libzip.a" \
            "$THEOS/lib/libzip.a"

          echo "=== Theos libzip ==="
          ls -lh "$THEOS/lib/libzip.a"
          file "$THEOS/lib/libzip.a"

      # ------------------------------------------------------------
      # 10. Build official appinst
      # ------------------------------------------------------------
      - name: Build appinst
        working-directory: appinst
        run: |
          make clean || true
          make package

      # ------------------------------------------------------------
      # 11. Inspect generated packages
      # ------------------------------------------------------------
      - name: Inspect packages
        run: |
          echo "=== Generated packages ==="
          find appinst/debs -maxdepth 1 -type f -name '*.deb' -print

          echo
          echo "=== Package information ==="

          for deb in appinst/debs/*.deb; do
            echo
            echo "--- $deb ---"
            dpkg-deb -I "$deb"
          done

      # ------------------------------------------------------------
      # 12. Upload
      # ------------------------------------------------------------
      - name: Upload appinst
        uses: actions/upload-artifact@v4
        with:
          name: appinst
          path: |
            appinst/debs/ai.akemi.appinst_*.deb
            appinst/debs/nodelete.com.linusyang.appinst.deb
