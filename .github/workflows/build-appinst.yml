```yaml
name: Build appinst

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      # ------------------------------------------------------------
      # 1. Checkout official AppSync repository
      # ------------------------------------------------------------
      - name: Checkout AppSync
        uses: actions/checkout@v5

      # ------------------------------------------------------------
      # 2. Install Linux build dependencies
      # ------------------------------------------------------------
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            fakeroot \
            rsync \
            curl \
            perl \
            git \
            libxml2 \
            libtinfo6 \
            autoconf \
            automake \
            libtool \
            pkg-config \
            xz-utils \
            file

      # ------------------------------------------------------------
      # 3. Install Theos
      # ------------------------------------------------------------
      - name: Install Theos
        run: |
          git clone --recursive \
            https://github.com/theos/theos.git \
            "$RUNNER_TEMP/theos"

          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # 4. Install official iPhoneOS 12.4 SDK
      # ------------------------------------------------------------
      - name: Install iPhoneOS 12.4 SDK
        run: |
          mkdir -p "$THEOS/sdks"

          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/theos/sdks.git \
            "$RUNNER_TEMP/sdks"

          cd "$RUNNER_TEMP/sdks"
          git sparse-checkout set iPhoneOS12.4.sdk

          cp -R \
            iPhoneOS12.4.sdk \
            "$THEOS/sdks/"

          test -d "$THEOS/sdks/iPhoneOS12.4.sdk"

      # ------------------------------------------------------------
      # 5. Install current official Theos Linux iOS toolchain
      # ------------------------------------------------------------
      - name: Install iOS toolchain
        run: |
          mkdir -p "$THEOS/toolchain"

          curl -fL \
            "https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz" \
            | tar -xJvf - -C "$THEOS/toolchain/"

          test -x "$THEOS/toolchain/linux/iphone/bin/clang"

          echo "=== clang ==="
          "$THEOS/toolchain/linux/iphone/bin/clang" --version

      # ------------------------------------------------------------
      # 6. Verify Theos environment
      # ------------------------------------------------------------
      - name: Verify Theos
        run: |
          echo "=== THEOS ==="
          echo "$THEOS"

          echo "=== SDK ==="
          ls -ld "$THEOS/sdks/iPhoneOS12.4.sdk"

          echo "=== Toolchain ==="
          ls -l "$THEOS/toolchain/linux/iphone/bin/clang"

      # ------------------------------------------------------------
      # 7. Download official libzip 0.11.2 source
      #
      # Official appinst documentation requires libzip 0.11.2.
      # We build it ourselves instead of downloading a BigBoss DEB.
      # ------------------------------------------------------------
      - name: Download libzip 0.11.2 source
        run: |
          mkdir -p "$RUNNER_TEMP/libzip"

          curl -fL \
            "https://libzip.org/download/libzip-0.11.2.tar.xz" \
            -o "$RUNNER_TEMP/libzip-0.11.2.tar.xz"

          file "$RUNNER_TEMP/libzip-0.11.2.tar.xz"

          tar -xJf \
            "$RUNNER_TEMP/libzip-0.11.2.tar.xz" \
            -C "$RUNNER_TEMP/libzip"

          test -d "$RUNNER_TEMP/libzip/libzip-0.11.2"

      # ------------------------------------------------------------
      # 8. Build libzip.a for armv7
      # ------------------------------------------------------------
      - name: Build libzip armv7
        run: |
          set -e

          BUILD="$RUNNER_TEMP/libzip-build-armv7"
          SRC="$RUNNER_TEMP/libzip/libzip-0.11.2"
          SDK="$THEOS/sdks/iPhoneOS12.4.sdk"
          CLANG="$THEOS/toolchain/linux/iphone/bin/clang"

          rm -rf "$BUILD"
          mkdir -p "$BUILD"

          cd "$SRC"

          make distclean >/dev/null 2>&1 || true

          ./configure \
            --host=arm-apple-darwin \
            --enable-static \
            --disable-shared \
            --disable-fs \
            --prefix="$BUILD/install" \
            CC="$CLANG" \
            CFLAGS="-target armv7-apple-ios5.0 -isysroot $SDK -miphoneos-version-min=5.0" \
            LDFLAGS="-target armv7-apple-ios5.0 -isysroot $SDK -miphoneos-version-min=5.0"

          make -j"$(nproc)"
          make install

          test -f "$BUILD/install/lib/libzip.a"

          mkdir -p "$RUNNER_TEMP/libzip-universal/armv7"
          cp "$BUILD/install/lib/libzip.a" \
            "$RUNNER_TEMP/libzip-universal/armv7/libzip.a"

          file "$RUNNER_TEMP/libzip-universal/armv7/libzip.a"

      # ------------------------------------------------------------
      # 9. Build libzip.a for armv7s
      # ------------------------------------------------------------
      - name: Build libzip armv7s
        run: |
          set -e

          BUILD="$RUNNER_TEMP/libzip-build-armv7s"
          SRC="$RUNNER_TEMP/libzip/libzip-0.11.2"
          SDK="$THEOS/sdks/iPhoneOS12.4.sdk"
          CLANG="$THEOS/toolchain/linux/iphone/bin/clang"

          rm -rf "$BUILD"
          mkdir -p "$BUILD"

          cd "$SRC"

          make distclean >/dev/null 2>&1 || true

          ./configure \
            --host=arm-apple-darwin \
            --enable-static \
            --disable-shared \
            --disable-fs \
            --prefix="$BUILD/install" \
            CC="$CLANG" \
            CFLAGS="-target armv7s-apple-ios5.0 -isysroot $SDK -miphoneos-version-min=5.0" \
            LDFLAGS="-target armv7s-apple-ios5.0 -isysroot $SDK -miphoneos-version-min=5.0"

          make -j"$(nproc)"
          make install

          test -f "$BUILD/install/lib/libzip.a"

          mkdir -p "$RUNNER_TEMP/libzip-universal/armv7s"
          cp "$BUILD/install/lib/libzip.a" \
            "$RUNNER_TEMP/libzip-universal/armv7s/libzip.a"

          file "$RUNNER_TEMP/libzip-universal/armv7s/libzip.a"

      # ------------------------------------------------------------
      # 10. Build libzip.a for arm64
      # ------------------------------------------------------------
      - name: Build libzip arm64
        run: |
          set -e

          BUILD="$RUNNER_TEMP/libzip-build-arm64"
          SRC="$RUNNER_TEMP/libzip/libzip-0.11.2"
          SDK="$THEOS/sdks/iPhoneOS12.4.sdk"
          CLANG="$THEOS/toolchain/linux/iphone/bin/clang"

          rm -rf "$BUILD"
          mkdir -p "$BUILD"

          cd "$SRC"

          make distclean >/dev/null 2>&1 || true

          ./configure \
            --host=aarch64-apple-darwin \
            --enable-static \
            --disable-shared \
            --disable-fs \
            --prefix="$BUILD/install" \
            CC="$CLANG" \
            CFLAGS="-target arm64-apple-ios5.0 -isysroot $SDK -miphoneos-version-min=5.0" \
            LDFLAGS="-target arm64-apple-ios5.0 -isysroot $SDK -miphoneos-version-min=5.0"

          make -j"$(nproc)"
          make install

          test -f "$BUILD/install/lib/libzip.a"

          mkdir -p "$RUNNER_TEMP/libzip-universal/arm64"
          cp "$BUILD/install/lib/libzip.a" \
            "$RUNNER_TEMP/libzip-universal/arm64/libzip.a"

          file "$RUNNER_TEMP/libzip-universal/arm64/libzip.a"

      # ------------------------------------------------------------
      # 11. Combine libzip architectures
      # ------------------------------------------------------------
      - name: Create universal libzip.a
        run: |
          set -e

          LIPO="$THEOS/toolchain/linux/iphone/bin/llvm-lipo"

          test -x "$LIPO"

          mkdir -p "$THEOS/lib"

          "$LIPO" -create \
            "$RUNNER_TEMP/libzip-universal/armv7/libzip.a" \
            "$RUNNER_TEMP/libzip-universal/armv7s/libzip.a" \
            "$RUNNER_TEMP/libzip-universal/arm64/libzip.a" \
            -output "$THEOS/lib/libzip.a"

          echo "=== Universal libzip ==="
          ls -lh "$THEOS/lib/libzip.a"
          file "$THEOS/lib/libzip.a"

          "$LIPO" -info "$THEOS/lib/libzip.a"

      # ------------------------------------------------------------
      # 12. Build official appinst
      # ------------------------------------------------------------
      - name: Build appinst
        working-directory: appinst
        run: |
          make clean || true
          make package

      # ------------------------------------------------------------
      # 13. Show generated packages
      # ------------------------------------------------------------
      - name: Inspect packages
        run: |
          echo "=== Generated packages ==="
          find appinst/debs -maxdepth 1 -type f -name '*.deb' -print

          echo
          echo "=== Package information ==="

          for deb in appinst/debs/*.deb; do
            echo
            echo "--- $deb ---"
            dpkg-deb -I "$deb"
          done

      # ------------------------------------------------------------
      # 14. Upload appinst package
      # ------------------------------------------------------------
      - name: Upload appinst
        uses: actions/upload-artifact@v4
        with:
          name: appinst
          path: |
            appinst/debs/ai.akemi.appinst_*.deb
            appinst/debs/nodelete.com.linusyang.appinst.deb
```
